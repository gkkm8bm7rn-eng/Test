name: Secret de Maison site quality gate
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'products.js'
      - 'styles.css'
      - 'package.json'
      - 'package-lock.json'
      - 'assets/products/**'
      - 'scripts/**'
      - '.github/workflows/validate-site.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: JavaScript syntax and source/media invariants
        run: |
          node --check app.js
          node --check products.js
          python3 scripts/check_site.py
      - name: Install pinned QA tools and browser engines
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit
      - name: DOM interaction regression
        run: node scripts/smoke_dom.cjs
      - name: Real browser scenarios and responsive screenshots
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/sdm-http.log 2>&1 &
          node scripts/browser_test.cjs --base-url http://127.0.0.1:8765/ --screenshots --output /tmp/sdm-browser-qa
      - name: Preserve browser reports and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-qa
          path: /tmp/sdm-browser-qa/
          retention-days: 14
