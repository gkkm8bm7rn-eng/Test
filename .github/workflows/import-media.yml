name: Validate or restore manifest-verified official photos
on:
  push:
    branches: [main]
    paths:
      - 'scripts/import_verified_images.py'
      - '.github/workflows/import-media.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Install image decoder
        run: python -m pip install --disable-pip-version-check 'Pillow==11.3.0'
      - name: Download and verify exact product photos
        run: python scripts/import_verified_images.py
      - name: Publish verified local assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/products/
          if ! git diff --cached --quiet; then
            git commit -m "assets: store verified SKU photos locally"
            git push
          fi
